<meta name="format-detection" content="telephone=no"><meta name="apple-mobile-web-app-title" content="برنامه‌ریز"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#05070d;--card:rgba(18,28,66,.52);--fg:#e8ecf7;--mute:#7c88a8;--soft:rgba(255,255,255,.08);--acc:#4f7cff;--sh:0 6px 28px rgba(0,0,0,.5);--bd:rgba(255,255,255,.13);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{background:#05070d}body{background:transparent;color:var(--fg);font-family:var(--ff,"IBM Plex Sans Arabic"),"Noto Sans Arabic",-apple-system,Tahoma,sans-serif;font-size:15px;line-height:1.75}
#app{max-width:600px;margin:0 auto;padding:14px 16px 140px}
#app.fx{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1.08)}}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;transition:transform .15s,opacity .2s}
button:active{transform:scale(.93)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.nav b{font-size:18px;font-weight:600}
.nav button{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:18px;color:var(--mute)}
.score{color:#fff;border-radius:28px;padding:22px 20px 18px;text-align:center;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:background .6s}
.score .p{font-size:52px;font-weight:700;line-height:1.15}.score .l{font-size:15px;opacity:.92;font-weight:300;min-height:1.7em}
.strip{display:flex;gap:7px;justify-content:center;margin-top:16px}
.strip i{width:34px;height:34px;border-radius:12px;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:transform .25s,background .5s}
.strip i.sel{transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.card{background:var(--card);border-radius:22px;padding:6px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.ah{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.ah h3{margin:0;font-size:15px;font-weight:600;flex:1}.ah small{color:var(--mute)}
.bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin:2px 0 4px}
.bar div{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
.h{display:flex;align-items:center;gap:13px;padding:11px 0;cursor:pointer;user-select:none;-webkit-user-select:none}
.h+.h{border-top:1px solid var(--soft)}

      else{var n=uid();tasks[n]={title:v[0],date:v[3]||day,time:v[4]||"",area:v[2],done:false};if(v[3])day=v[3];save("tasks",n)}
      render()}});
}
function editSheet(code){
  var p=code.split(":");
  if(p[0]==="t"){var t=tasks[p[1]];
    sheet({title:"ویرایش",fields:[{val:t.title},{t:"select",val:t.area||"",opts:catOpts()},{t:"date",val:t.date},{t:"time",val:t.time}],
      ok:function(v){t.title=v[0];t.area=resolveCat(v[1]);t.date=v[2]||t.date;t.time=v[3];save("tasks",p[1]);render()},del:function(){remove("tasks",p[1]);render()}})}
  else{var a=areas[p[1]],h=a.habits.filter(function(x){return x.id===p[2]})[0];
    sheet({title:"ویرایش مورد روزانه",fields:[{val:h.name},{t:"select",val:p[1],opts:catOpts().slice(1)}],
      ok:function(v){h.name=v[0];v[1]=resolveCat(v[1]);if(v[1]!==p[1]){a.habits=a.habits.filter(function(x){return x.id!==p[2]});areas[v[1]].habits=(areas[v[1]].habits||[]).concat([h]);save("areas",v[1])}save("areas",p[1]);render()},
      del:function(){a.habits=a.habits.filter(function(x){return x.id!==p[2]});save("areas",p[1]);render()}})}
}
$("fab").onclick=function(){if(view==="skills")skillSheet();else addSheet()};

document.addEventListener("click",function(e){
  var t=e.target,g=function(a){var el=t.closest("["+a+"]");return el?el:null},el;
  if((el=g("data-edit"))){editSheet(el.getAttribute("data-edit"));return}
  if((el=g("data-v"))){view=el.getAttribute("data-v");if(view==="cal")anchor=dt(day);render(true);window.scrollTo(0,0);return}
  if((el=g("data-day"))||(el=g("data-pick"))){day=el.getAttribute("data-day")||el.getAttribute("data-pick");render(true);return}
  if((el=g("data-t"))){var i=el.getAttribute("data-t"),T=tasks[i];T.done=!T.done;setRow(el,T.done);patch();save("tasks",i);return}
  if((el=g("data-h"))){var hid=el.getAttribute("data-h"),L=logs[day]=logs[day]||{done:{}};L.done=L.done||{};L.done[hid]=!L.done[hid];setRow(el,L.done[hid]);patch();save("logs",day);return}
  if((el=g("data-a"))){var v=el.getAttribute("data-a");
    if(v==="prev"||v==="next"){day=key(add(dt(day),v==="prev"?-1:1));if(view==="cal")anchor=dt(day);render(true)}
    if(v==="pm"||v==="nm"){var s=add(anchor,-(part(anchor,"day")-1));anchor=v==="pm"?add(s,-1):add(s,32);render(true)}
    if(v==="newarea")areaSheet();
    if(v==="newskill")skillSheet();
    if(v==="lib")libSheet();
    if(v==="add")addSheet();
    return}
  if((el=g("data-skedit"))){skillSheet(el.getAttribute("data-skedit"));return}
  if((el=g("data-skq"))){var qi=el.getAttribute("data-skq"),K=skills[qi];K.entries=(K.entries||[]).concat([{d:key(new Date()),a:+K.step||1}]);save("skills",qi);skRefresh(qi);return}
  if((el=g("data-skadd"))){skAdd(el.getAttribute("data-skadd"));return}
  if((el=g("data-skundo"))){var ui=el.getAttribute("data-skundo");skills[ui].entries=(skills[ui].entries||[]).slice(0,-1);save("skills",ui);skRefresh(ui);return}
  if((el=g("data-bk"))){if(el.getAttribute("data-bk")==="copy")bkCopy();else bkRestore();return}
  if((el=g("data-syn"))){synSheet();return}
  if((el=g("data-font"))){setFont(el.getAttribute("data-font"));return}
  if((el=g("data-o"))){var o=el.getAttribute("data-o");openArea=openArea===o?null:o;render();return}
  if((el=g("data-addin"))){addSheet(el.getAttribute("data-addin"),"daily");return}
  if((el=g("data-ea"))){areaSheet(el.getAttribute("data-ea"));return}
});
var nt={},np={};
function flushNotes(){Object.keys(np).forEach(function(id){clearTimeout(nt[id]);delete np[id];if(areas[id])save("areas",id)})}
document.addEventListener("visibilitychange",function(){if(document.hidden)flushNotes()});window.addEventListener("pagehide",flushNotes);
document.addEventListener("input",function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-notes");if(!id)return;areas[id].notes=e.target.value;clearTimeout(nt[id]);np[id]=1;nt[id]=setTimeout(function(){delete np[id];save("areas",id)},600)});
document.addEventListener("focusout",function(e){if(e.target.tagName==="TEXTAREA")setTimeout(render,80)});

function cfgGet(){try{return JSON.parse(localStorage.getItem("lp_cloud")||"null")}catch(e){return null}}
function syncCard(){var c=cfgGet();return'<div class="card"><div class="ah"><h3>همگام‌سازی بین دستگاه‌ها</h3></div><p class="mute" style="margin:0 0 4px;font-size:13px">'+(c?"✓ فعال است — داده‌ها بین همه دستگاه‌ها یکی می‌شن<br>کد: <b dir=ltr>"+esc(c.code)+"</b>":"فعلاً داده‌ها فقط روی همین دستگاه ذخیره می‌شن.<br>برای یکی شدن روی آیفون و کامپیوتر، همگام‌سازی رو روشن کن.")+'</p><div class="row"><button class="btn" data-syn="1">'+(c?"تغییر یا قطع":"فعال‌سازی همگام‌سازی")+'</button><button class="btn g" data-bk="copy">کپی پشتیبان</button><button class="btn g" data-bk="restore">بازگردانی</button></div></div>'}
function bkCopy(){
  var t=JSON.stringify({v:1,d:{areas:areas,logs:logs,tasks:tasks,skills:skills}});
  function done(){alert("پشتیبان کپی شد.\n\nتوی Notes گوشی یا یه فایل متنی روی کامپیوتر بچسبون و نگه دار.\nبرای بازگردانی همین متن رو تو دکمه «بازگردانی» بچسبون.")}
  function fb(){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");done()}catch(e){alert("کپی نشد — دستی انتخاب و کپی کن")}document.body.removeChild(x)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();
}
function bkRestore(){
  sheet({title:"بازگردانی پشتیبان",fields:[{ph:"متن پشتیبان رو اینجا بچسبون"}],ok:function(v){
    try{var o=JSON.parse(v[0]).d,n=0;["areas","logs","tasks","skills"].forEach(function(c){var m=o[c]||{};Object.keys(m).forEach(function(id){MAP[c][id]=m[id];save(c,id);n++})});render();alert(n+" مورد بازگردانی شد.")}catch(e){alert("متن پشتیبان معتبر نیست.")}}});
}
function synSheet(){var c=cfgGet()||{url:"",code:""};
  var help='<div style="background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.7;color:var(--mute)">'+
    '<b style="color:var(--fg)">چطور رایگان بسازیم؟ (۲ دقیقه)</b><br>'+
    '۱. برو به <span dir=ltr>console.firebase.google.com</span> و با جیمیل وارد شو<br>'+
    '۲. «Create a project» بزن (اسم دلخواه، Google Analytics رو خاموش کن)<br>'+
    '۳. از منوی سمت چپ: <b>Build → Realtime Database</b><br>'+
    '۴. Create Database → مکان Europe یا US → بعد <b>Start in test mode</b><br>'+
    '۵. بالای صفحه آدرس رو کپی کن (مثل <span dir=ltr>https://xxx-default-rtdb.firebaseio.com</span>)<br>'+
    '۶. یه کد مخفی طولانی بنویس (مثل اسم+عدد+علامت) و هر دو دستگاه همون کد رو بذار<br>'+
    '<br>قوانین امنیتی (Rules) باید این باشه تا کار کنه:<br>'+
    '<code dir=ltr style="display:block;background:rgba(0,0,0,.3);padding:8px;border-radius:8px;margin-top:6px;font-size:12px">{"rules":{".read":true,".write":true}}</code>'+
    '</div>';
  $("sh").innerHTML='<h4>همگام‌سازی بین دستگاه‌ها</h4>'+help+
    '<input id="f0" type="text" placeholder="آدرس Realtime Database (با https)" value="'+esc(c.url)+'" dir="ltr" style="margin-bottom:10px">'+
    '<input id="f1" type="text" placeholder="کد مخفی مشترک (روی همه دستگاه‌ها یکی)" value="'+esc(c.code)+'" dir="ltr" style="margin-bottom:10px">'+
    '<div class="row"><button class="btn" id="sok">ذخیره و فعال‌سازی</button><button class="btn g" id="sno">بستن</button><span class="sp"></span>'+(c?'<button class="btn g r" id="sdel">قطع همگام‌سازی</button>':"")+'</div>';
  $("ov").style.display="block";document.body.style.overflow="hidden";$("fab").style.visibility="hidden";
  setTimeout(function(){$("ov").style.opacity=1;$("sh").style.transform="none"},20);
  okFn=function(){var v0=$("f0").value.trim(),v1=$("f1").value.trim();
    if(v0.indexOf("https://")!==0||!v1){alert("آدرس باید با https:// شروع بشه و کد مخفی خالی نباشه.");return}
    if(v0.indexOf("firebaseio.com")<0&&v0.indexOf("firebasedatabase.app")<0){if(!confirm("آدرس شبیه آدرس Firebase نیست. مطمئنی درسته؟"))return}
    try{localStorage.setItem("lp_cloud",JSON.stringify({url:v0.replace(/\/+$/,""),code:v1}))}catch(e){}
    location.reload()};
  delFn=c?function(){if(confirm("همگام‌سازی قطع بشه؟ داده‌های این دستگاه می‌مونه ولی دیگه با بقیه یکی نمی‌شه.")){try{localStorage.removeItem("lp_cloud")}catch(e){}location.reload()}}:null;
}
function cloud(cf){
  var base=cf.url.replace(/\/+$/,"")+"/"+encodeURIComponent(cf.code),subs={},started=false,busy=false,lastOk=0;
  function ld(c){try{return JSON.parse(localStorage.getItem("lp_"+c)||"{}")}catch(e){return{}}}
  function sv(c,o){try{localStorage.setItem("lp_"+c,JSON.stringify(o))}catch(e){}}
  function ob(){try{return JSON.parse(localStorage.getItem("lp_out")||"[]")}catch(e){return[]}}
  function sob(o){try{localStorage.setItem("lp_out",JSON.stringify(o))}catch(e){}}
  function fire(c){var o=ld(c);(subs[c]||[]).forEach(function(f){f(Object.keys(o).map(function(k){return{id:k,data:o[k]}}))})}
  function queue(op){var o=ob().filter(function(x){return!(x.c===op.c&&x.id===op.id)});o.push(op);sob(o)}
  function push(op){var opts={method:op.d?"PUT":"DELETE",headers:{"Content-Type":"application/json"}};if(op.d)opts.body=JSON.stringify(op.d);
    return fetch(base+"/"+op.c+"/"+encodeURIComponent(op.id)+".json",opts).then(function(r){if(!r.ok)throw new Error(r.status)})}
  function flush(){var o=ob();if(!o.length)return Promise.resolve();var op=o[0],sig=JSON.stringify(op);return push(op).then(function(){sob(ob().filter(function(x){return JSON.stringify(x)!==sig}));return flush()})}
  function pull(){return fetch(base+".json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(t){t=t||{};var pend={};ob().forEach(function(x){pend[x.c+"/"+x.id]=1});
    ["areas","logs","tasks","skills"].forEach(function(c){var rem=t[c]||{},loc=ld(c),ch=false;
      Object.keys(rem).forEach(function(id){if(pend[c+"/"+id])return;if(JSON.stringify(loc[id])!==JSON.stringify(rem[id])){loc[id]=rem[id];ch=true}});
      Object.keys(loc).forEach(function(id){if(!rem[id]&&!pend[c+"/"+id]){delete loc[id];ch=true}});
      if(ch){sv(c,loc);fire(c)}})})}
  function tick(){if(busy)return;busy=true;$("st").textContent="…";
    flush().then(pull).then(function(){lastOk=Date.now();$("st").textContent="✓ همگام"},function(e){$("st").textContent=ob().length?"آفلاین · صف: "+ob().length:"خطا در اتصال"}).then(function(){busy=false})}
  return{sync:true,
    sub:function(c,f){(subs[c]=subs[c]||[]).push(f);fire(c);
      if(!started){started=true;var fk="lp_init_"+cf.code;
        if(!localStorage.getItem(fk)){["areas","logs","tasks","skills"].forEach(function(k){var o=ld(k);Object.keys(o).forEach(function(id){queue({c:k,id:id,d:o[id]})})});try{localStorage.setItem(fk,"1")}catch(e){}}
        tick();setInterval(tick,4000);document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});window.addEventListener("online",tick);
        window.addEventListener("focus",function(){if(Date.now()-lastOk>8000)tick()})}},
    save:function(c,id,d){var o=ld(c);o[id]=d;sv(c,o);queue({c:c,id:id,d:d});tick();return Promise.resolve()},
    del:function(c,id){var o=ld(c);delete o[id];sv(c,o);queue({c:c,id:id,d:null});tick();return Promise.resolve()}};
}
function start(db){
  var cf=cfgGet();store=cf?cloud(cf):local();$("st").textContent=cf?"در حال اتصال…":"ذخیره روی همین دستگاه";
  store.sub("areas",feed("areas"));store.sub("logs",feed("logs"));store.sub("tasks",feed("tasks"));store.sub("skills",feed("skills"));
}
try{var sf=localStorage.getItem("lp_font");if(sf)setFont(sf)}catch(e){}
render(true);
start(null);
})();
</script>
